name: Reproducibility audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 statsmodels==0.14.6 matplotlib==3.10.8 openpyxl==3.1.5 requests>=2.31

      - name: Compile analysis scripts
        run: python -m py_compile src/*.py

      - name: Audit iLINCS and TCGA public source tables
        run: python src/audit_external_outputs.py --repo .

      - name: Audit canonical release summaries
        run: python src/audit_canonical.py --repo .
